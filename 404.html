<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — 页面不存在</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
  .code { font-family: var(--mono); font-size: clamp(5rem, 18vw, 10rem); line-height: 1;
          letter-spacing: -0.04em; margin: 0; font-weight: 650; }
  .msg { color: var(--muted); margin: 8px 0 28px; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bg-grid"></div><div class="bg-glow bg-glow-a"></div></div>
<main class="wrap">
  <div>
    <p class="code grad-text">404</p>
    <p class="msg">这个地址没有内容，可能是链接过期了。</p>
    <a class="btn btn-primary" href="/">返回首页</a>
  </div>
</main>
</body>
</html>
